name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  backend:
    name: Backend and compatibility gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build compatible frontend and verify bundle
        run: npm run build
      - name: Run backend and API contracts
        run: npm run test:unit

  e2e:
    name: Real browser E2E
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run DOM-only Playwright regression suite
        env:
          E2E_RUN_DIR: ${{ runner.temp }}/phantom-e2e-runs
        run: npm run test:e2e
      - name: Upload Playwright report and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_attempt }}
          path: |
            test-results/
            ${{ runner.temp }}/phantom-e2e-runs/
          if-no-files-found: ignore
          retention-days: 14
